server {
    listen 80;
    listen [::]:80;
    server_name oryfikry.my.id;
    return 301 https://$host$request_uri;
}

# LOTM recap library — PRIMARY di apex (sejak 2026-10-21; lotm/yt jadi redirect)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oryfikry.my.id;

    root /var/www/yt;
    index index.html;

    # HTML: revalidate singkat
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }
    # Data & catalog: file kecil, sering berubah saat deploy -> jangan cache
    location ^~ /data/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /catalog.js {
        add_header Cache-Control "no-store";
    }
    # JS/CSS app: pakai versi di nama file (?v=) -> cache lama aman
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Audio & gambar: besar & tidak berubah setelah rilis -> cache setahun
    location ~* \.(mp3|ogg|wav|png|jpg|jpeg|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cert LE yt.oryfikry.my.id dipakai bersama — cukup utk Cloudflare proxied
    # (mode non-strict). Ganti kalau apex nanti punya cert sendiri via certbot.
    ssl_certificate /etc/letsencrypt/live/yt.oryfikry.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.oryfikry.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
