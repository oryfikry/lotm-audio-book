server {
    server_name lotm.oryfikry.my.id yt.oryfikry.my.id;

    root /var/www/yt;
    index index.html;

    # HTML: revalidate singkat
    location = /index.html {
        add_header Cache-Control "public, max-age=300";
    }
    # Data & catalog: file kecil, sering berubah saat deploy -> jangan cache
    location ^~ /data/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }
    location = /catalog.js {
        add_header Cache-Control "no-store";
    }
    # JS/CSS app: pakai versi di nama file (?v=) -> cache lama aman
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Audio & gambar: besar & tidak berubah setelah rilis -> cache setahun
    location ~* \.(mp3|ogg|wav|png|jpg|jpeg|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yt.oryfikry.my.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yt.oryfikry.my.id/privkey.pem; # managed by Certbot
}

server {
    if ($host = yt.oryfikry.my.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name lotm.oryfikry.my.id yt.oryfikry.my.id;
    return 404; # managed by Certbot
}
