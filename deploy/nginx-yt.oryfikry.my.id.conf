# lotm.oryfikry.my.id + yt.oryfikry.my.id -> REDIRECT permanen ke apex
# (bind konten dihapus 2026-10-21; library kini di oryfikry.my.id)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lotm.oryfikry.my.id yt.oryfikry.my.id;

    return 301 https://oryfikry.my.id$request_uri;

    ssl_certificate /etc/letsencrypt/live/yt.oryfikry.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.oryfikry.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name lotm.oryfikry.my.id yt.oryfikry.my.id;

    return 301 https://oryfikry.my.id$request_uri;
}
