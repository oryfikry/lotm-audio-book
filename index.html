<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOTM Vol 1 Recap — Narration Package</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="meta" id="meta"></div>
  <h1>Lord of the Mysteries</h1>
  <p class="sub">Volume 1 Recap — narration package</p>
</header>
<section id="toolbar">
  <label>Search <input id="q" type="search" placeholder="scene, kata kunci…"></label>
  <label>Scene <input id="sort" type="number" value="1" min="1" max="19"></label>
  <button id="dl-all">Download all audio (zip)</button>
  <span id="status" role="status"></span>
</section>
<main id="list"></main>
<div id="player" hidden>
  <button id="p-close" aria-label="Close player">×</button>
  <div class="p-title" id="p-title"></div>
  <audio id="p-audio" controls preload="metadata"></audio>
</div>
<footer>static build · voice Fenrir</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
