<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LOTM recap library — scenes, scripts, and audio status.">
  <title>LOTM Recap Library</title>
  <link rel="stylesheet" href="style.css?v=20260909-vol3-part6-1">
</head>
<body>
  <header class="hero">
    <div class="eyebrow">Narration library</div>
    <h1>Lord of the Mysteries</h1>
    <p id="subtitle">Browse recap scripts by volume and part.</p>
  </header>

  <main>
    <section class="control-panel" aria-label="Scene library controls">
      <div class="selectors">
        <label>Volume
          <select id="volume" aria-label="Select volume"></select>
        </label>
        <label>Part
          <select id="part" aria-label="Select part"></select>
        </label>
        <label class="search-label">Find a scene
          <input id="q" type="search" placeholder="scene, narration, keyword…" autocomplete="off">
        </label>
        <label>Jump to scene
          <input id="scene-jump" type="number" value="1" min="1" inputmode="numeric">
        </label>
      </div>
      <div class="summary-row">
        <div class="summary" id="summary" role="status"></div>
        <button id="dl-all" hidden>Download available audio</button>
      </div>
    </section>

    <section class="part-banner" id="part-banner" aria-live="polite">
      <div>
        <span class="status-pill" id="availability"></span>
        <h2 id="part-title"></h2>
        <p id="part-description"></p>
      </div>
      <dl class="part-stats">
        <div><dt>Scenes</dt><dd id="scene-count">—</dd></div>
        <div><dt>Voice</dt><dd id="voice">—</dd></div>
        <div><dt>Duration</dt><dd id="duration">—</dd></div>
      </dl>
    </section>

    <p class="result-count" id="result-count"></p>
    <section id="list" class="scene-list" aria-label="Scenes"></section>
  </main>

  <div id="player" hidden aria-live="polite">
    <div class="p-title" id="p-title"></div>
    <div class="p-controls">
      <button id="p-auto" type="button" aria-pressed="false" title="Autoplay next scene" aria-label="Autoplay next scene"><span aria-hidden="true">⏭</span><span class="p-auto-label">Auto</span></button>
      <button id="p-close" aria-label="Close player">×</button>
    </div>
    <audio id="p-audio" controls preload="metadata"></audio>
  </div>

  <footer>LOTM recap library · scripts remain available before audio production</footer>
  <script src="catalog.js?v=20260909-vol3-part6-1"></script>
  <script src="app.js?v=20260909-vol3-part6-1"></script>
</body>
</html>
